edges:
  - from: orchestrator
    to: demo-small
    kind: invokes_model
    policy:
      timeoutMs: 2000
      retry:
        maxAttempts: 3
        bounded: true
        backoff: exponential
        idempotency: declared

  - from: demo-small
    to: demo-large
    kind: falls_back_to
    note: Configured fallback that the default path does not reach.

  - from: orchestrator
    to: lookup_account
    kind: calls_tool
  - from: orchestrator
    to: check_inventory
    kind: calls_tool
  - from: orchestrator
    to: search_policies
    kind: calls_tool
  - from: orchestrator
    to: send_notification
    kind: calls_tool
    policy:
      retry:
        maxAttempts: 2
        bounded: true
        backoff: fixed
        idempotency: declared

  - from: orchestrator
    to: issue_refund
    kind: calls_tool
    policy:
      timeoutMs: 1500
      requiresApproval: true
      retry:
        maxAttempts: 3
        bounded: true
        backoff: fixed
        idempotency: absent

  - from: orchestrator
    to: escalate_to_human
    kind: calls_tool
    note: Registered path that the default scenario never takes.

  - from: orchestrator
    to: account-worker
    kind: hands_off_to
  - from: orchestrator
    to: inventory-worker
    kind: hands_off_to
  - from: orchestrator
    to: shipping-worker
    kind: hands_off_to
  - from: orchestrator
    to: billing-worker
    kind: hands_off_to

  - from: account-worker
    to: demo-small
    kind: invokes_model
  - from: inventory-worker
    to: demo-small
    kind: invokes_model

  - from: orchestrator
    to: policy-store
    kind: queries_retrieval
  - from: orchestrator
    to: conversation-memory
    kind: reads_memory
  - from: orchestrator
    to: conversation-memory
    kind: writes_memory
  - from: orchestrator
    to: refunds
    kind: publishes_to_queue
  - from: orchestrator
    to: audit-log
    kind: performs_side_effect
  - from: issue_refund
    to: refund-approval
    kind: guarded_by
