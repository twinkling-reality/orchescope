name: Bug report
description: Something behaves differently from what the documentation says
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        If this is a security problem, do not open an issue. See SECURITY.md for the private channel.
  - type: input
    id: version
    attributes:
      label: Version
      description: The output of `orchescope --version`
      placeholder: 0.1.0
    validations:
      required: true
  - type: dropdown
    id: platform
    attributes:
      label: Platform
      options: [macOS, Linux, other]
    validations:
      required: true
  - type: textarea
    id: command
    attributes:
      label: The command you ran
      description: The exact command, including flags
      render: shell
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: What you expected
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: What happened
      description: Paste the output. Rerun with `--verbose` for a stack trace, and remove anything sensitive first.
      render: shell
    validations:
      required: true
  - type: textarea
    id: doctor
    attributes:
      label: orchescope doctor
      description: The output of `orchescope doctor`, which reports what this machine can and cannot do
      render: shell
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: How to reproduce it
      description: >
        A repository or a scenario that reproduces this is the most useful thing you can attach. If the repository is
        private, `orchescope audit --json` with the findings removed usually shows enough.
