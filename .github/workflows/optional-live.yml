name: optional live checks

# Nothing here is required, and nothing here runs automatically.
#
# These checks need something the required set deliberately refuses to depend on: outbound network access, or a longer
# budget than a pull request should spend. Keeping them separate is what lets a fork run the entire required gate with
# no secret at all.
#
# A maintainer starts this by hand. Nothing here calls a model: analysis in this build is deterministic, and the job
# that used to assert over an empty array of model produced findings was removed with the feature it was asserting on.

on:
  workflow_dispatch:
    inputs:
      long_benchmark:
        description: Run the benchmark with enough repetitions to report quantiles
        type: boolean
        default: false
      corpus:
        description: Run the corpus check over every pinned repository, cloning each one
        type: boolean
        default: false

permissions:
  contents: read

env:
  NO_COLOR: '1'

jobs:
  long-benchmark:
    name: benchmark with enough repetitions to report quantiles
    if: inputs.long_benchmark
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v6
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile

      # Twenty repetitions per variant is what a p95 needs. The required set runs three, which is honest about withholding
      # the quantiles it cannot compute rather than reporting them from too few samples.
      - name: benchmark the demonstration system
        run: |
          pnpm --silent orchescope --cwd apps/demo benchmark \
            --scenario support-desk --agents 1,2,4 --repetitions 20 --warmup 2 --json > benchmark.json
          node --input-type=module -e "
            import { readFileSync } from 'node:fs';
            const { data } = JSON.parse(readFileSync('benchmark.json', 'utf8'));
            for (const variant of data.variants) {
              if (variant.durationMs.p95 === undefined) {
                throw new Error(variant.variantId + ' still withheld p95 with ' + variant.completedRuns + ' runs');
              }
            }
            console.log(data.variants.length + ' variant(s) with reportable quantiles');
          "
      - uses: actions/upload-artifact@v4
        with:
          name: long-benchmark
          path: benchmark.json
          retention-days: 30

  corpus:
    name: discovery measured against every pinned repository
    if: inputs.corpus
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile

      # Third party source is never vendored, so each entry is cloned at its pinned commit into a directory git
      # ignores. That is the network access the required gate refuses to depend on, and the reason this job is
      # here rather than in ci.yml.
      # --exercise installs a virtual environment and runs one repository's own example so the declared against
      # exercised delta is measured on code this repository did not write. No provider is called: the driver uses
      # the library's own offline model and turns model requests off.
      - name: every pinned repository still produces what is recorded
        run: pnpm corpus:exercise

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: corpus-summary
          path: corpus/.cache/corpus-summary.json
          retention-days: 30
