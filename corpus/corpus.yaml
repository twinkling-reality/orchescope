  - name: vercel-ai-chatbot-exercised
    source: git
    url: https://github.com/vercel/ai-chatbot.git
    commit: c2f8235e1f3ea903ad8b7f61447c4f74164b5c58
    kind: agent_system
    why: >-
      The same commit as the entry above, measured with a run in it. The join had only ever been shown on Python, and
      instrumentation is the half of it that differs most between languages: a decoder that reads one dialect says
      nothing about the other. This is the entry that holds the JavaScript half.

      It is also where a run that reached a model and a tool reported no relation between them and anything else. The
      AI SDK opens a step span around each of them, this build could not read it, and a span it cannot read used to
      end the chain rather than pass through it. The two relations that now appear are what a run of six spans had
      been proving and throwing away, so they are the number this entry holds against that going quiet again.
    exercise:
      why: >-
        The application's own offline model and its own tool, driven through the SDK's OpenTelemetry integration. No
        provider is called, no credential is used, and the tool is invoked on the branch of its own code that answers
        without contacting a weather service. What it cannot reach is the application's own agents, which are Next.js
        server actions needing a request, a session and a database, and that limit is part of what this entry records.
      script: corpus/runs/vercel-ai-chatbot/exercise.mjs
      # The SDK the repository pins, the integration that emits spans from version 7 onwards, the exporter, and zod,
      # which the repository's own tool imports.
      nodePackages:
        - ai@7.0.15
        - '@ai-sdk/otel'
        - '@opentelemetry/sdk-trace-node'
        - '@opentelemetry/exporter-trace-otlp-http'
        - zod

