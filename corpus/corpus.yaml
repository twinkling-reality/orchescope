# The corpus.
#
# Every adapter in this repository was validated against a fixture written by whoever wrote the adapter, which is
# circular: the fixture encodes what the author already believed. This file pins real repositories instead, so that
# what a scan produces is measured rather than assumed, and so that a framework moving in the field shows up as a
# diff rather than as silence.
#
# Third party source is never vendored here. Each entry names a commit, and `scripts/corpus.mjs` clones that commit
# into `corpus/.cache`, which is ignored by git. Licence compliance is the reason: this repository is Apache-2.0 and
# the corpus is not, so the corpus stays outside it.
#
# An entry needs:
#   name    the file name under corpus/expected, and the directory name in the cache
#   source  git for a third party repository, local for a directory of this repository
#   kind    agent_system or not_agent_system, which is the claim the expectation has to bear out
#   why     what this entry is here to catch, in enough detail that removing it is a decision
#
# An entry may also carry an `exercise` block, which names a script that makes the repository emit spans so the
# declared against exercised delta can be measured on it. Those entries install an environment and run third party
# code, so they are skipped unless `--exercise` is passed, and the skip is printed rather than silent. An exercise
# that reaches a provider names the variables it cannot start without in `requiresEnvironment`, and a machine
# without them skips that entry with the reason printed rather than failing inside somebody else's SDK.
#
# Both polarities count. A repository that is not an agent system is a precision test: the number it holds is a
# ceiling, and the guard against a reader being loosened until it matches ordinary English.

schemaVersion: 1

repositories:
  - name: demonstration-system
    source: local
    path: apps/demo
    kind: agent_system
    why: >-
      The bundled demonstration, which is the only entry that exercises the manifest adapter and the only one that
      runs with no network at all. It is the offline subset, so a change to the traversal, the effect reader or the
      prompt reader is caught by the required gate rather than by a dispatch a maintainer has to remember to start.

  - name: orchescope-discovery
    source: local
    path: packages/discovery
    kind: not_agent_system
    why: >-
      Every framework name Orchescope knows appears in this directory as a string literal, and so does most of the
      vocabulary of the domain. A reader that matches on names rather than on facts lights it up. The ceiling is
      zero components: this package reads agent systems and is not one.

  - name: openai-agents-python
    source: git
    url: https://github.com/openai/openai-agents-python.git
    commit: c1b423749e2bf8ca5f89cad13e2a144c9683a6ee
    kind: agent_system
    why: >-
      The first real repository this tool was pointed at, and the one that crashed it: an adapter named an endpoint
      it never created and one unbuildable relation ended a scan of 843 files. It is also the repository that shows
      what findings do at scale, which is what milestone 2 has to fix.

  - name: openai-agents-js
    source: git
    url: https://github.com/openai/openai-agents-js.git
    commit: 52b2702fc034fb47f79ec50fad173f0e9b068ca6
    kind: agent_system
    why: >-
      The same framework in the other ecosystem. The adapter claims to read one fact model in two languages, and
      only a repository in each language holds that claim up.

  - name: langgraph
    source: git
    url: https://github.com/langchain-ai/langgraph.git
    commit: 30c4d58db86455128e42ddec96b1ba53c553ba22
    kind: agent_system
    why: >-
      The library whose functional API produced "no agent system was detected" when the truth was that the reader
      was behind. Its own tests and examples are written in every form the library documents, which is exactly the
      surface a per framework reader drifts away from.

  - name: langgraphjs
    source: git
    url: https://github.com/langchain-ai/langgraphjs.git
    commit: 07ba620415532c3d9935ff8946bda3685412444a
    kind: agent_system
    why: >-
      LangGraph in JavaScript, and the entry that currently reports two blind spots: the repository imports the
      Vercel AI SDK and an OpenAI client that the adapters claiming them read nothing from. Those two lines are the
      measurement, and they stay in the expectation until an adapter earns their removal.

  - name: crewai
    source: git
    url: https://github.com/crewAIInc/crewAI.git
    commit: b3aaaab023a53a08db4d36c9430b3463f1efcc7d
    kind: agent_system
    why: >-
      The only corpus entry for the CrewAI adapter, and the largest tree in it: 2027 files discovered against 1272
      parsed, which is the parse rate a Python repository of that shape actually produces.

  - name: pydantic-ai
    source: git
    url: https://github.com/pydantic/pydantic-ai.git
    commit: ed0f40c0e5061722f7d9f579ed7efff1b74e3ea5
    kind: agent_system
    why: >-
      The newest adapter, so the one with the least field evidence behind it. It is also the only entry that does
      not read every file it claims to: four Python files are past the size limit, and that number is worth watching
      on its own.

  - name: pydantic-ai-exercised
    source: git
    url: https://github.com/pydantic/pydantic-ai.git
    commit: ed0f40c0e5061722f7d9f579ed7efff1b74e3ea5
    kind: agent_system
    why: >-
      The same commit as the entry above, measured with a run in it. It is a second entry rather than a flag on the
      first because a stored run adds components and relations to the graph, and one expectation cannot describe a
      repository both with and without its own run. This is the only entry that exercises the declared against
      exercised join on code this repository did not write.
    exercise:
      why: >-
        The declared against exercised delta is the centre of this product and it had only ever been shown on the
        demonstration this repository also wrote. This is the join on third party code: the library's own
        bank_support example, driven by the library's own offline model, so a real run reaches a real declaration
        and every name that fails to match is recorded rather than assumed.
      script: corpus/runs/pydantic-ai/exercise.py
      # In install order. The checkout pins its sibling packages by an exact version, so pydantic_graph has to be
      # installed from the checkout before pydantic_ai_slim asks for it. The provider client is needed because the
      # example names an OpenAI model and the constructor resolves the provider while the module is imported; no
      # request is ever made, and the driver turns model requests off to guarantee it.
      pythonPackages:
        - pydantic_graph
        - pydantic_ai_slim
        - openai
        - opentelemetry-sdk
        - opentelemetry-exporter-otlp-proto-http
      # The checkout is shallow and has no tags, so the version this build backend derives from git is empty. This
      # tells it to use a fixed version instead of failing, which is what makes an install from a pinned commit work.
      buildEnvironment:
        UV_DYNAMIC_VERSIONING_BYPASS: 0.0.0

  - name: vercel-ai-chatbot
    source: git
    url: https://github.com/vercel/ai-chatbot.git
    commit: c2f8235e1f3ea903ad8b7f61447c4f74164b5c58
    kind: agent_system
    why: >-
      The Vercel AI SDK read from an application that uses it rather than from the library that defines it. A
      framework repository and a consumer of that framework are different shapes, and an adapter can read one
      without reading the other.

  - name: vercel-ai-chatbot-exercised
    source: git
    url: https://github.com/vercel/ai-chatbot.git
    commit: c2f8235e1f3ea903ad8b7f61447c4f74164b5c58
    kind: agent_system
    why: >-
      The same commit as the entry above, measured with a run in it. The join had only ever been shown on Python, and
      instrumentation is the half of it that differs most between languages: a decoder that reads one dialect says
      nothing about the other. This is the entry that holds the JavaScript half.

      It is also where a run that reached a model and a tool reported no relation between them and anything else. The
      AI SDK opens a step span around each of them, this build could not read it, and a span it cannot read used to
      end the chain rather than pass through it. The two relations that now appear are what a run of six spans had
      been proving and throwing away, so they are the number this entry holds against that going quiet again.
    exercise:
      why: >-
        The application's own offline model and its own tool, driven through the SDK's OpenTelemetry integration. No
        provider is called, no credential is used, and the tool is invoked on the branch of its own code that answers
        without contacting a weather service. What it cannot reach is the application's own agents, which are Next.js
        server actions needing a request, a session and a database, and that limit is part of what this entry records.
      script: corpus/runs/vercel-ai-chatbot/exercise.mjs
      # The SDK the repository pins, the integration that emits spans from version 7 onwards, the exporter, and zod,
      # which the repository's own tool imports.
      nodePackages:
        - ai@7.0.15
        - '@ai-sdk/otel'
        - '@opentelemetry/sdk-trace-node'
        - '@opentelemetry/exporter-trace-otlp-http'
        - zod

  - name: anthropic-quickstarts
    source: git
    url: https://github.com/anthropics/anthropic-quickstarts.git
    commit: 370e18d4a20ff5fd4bc1a6bf11d5105b2383977c
    kind: agent_system
    why: >-
      Model SDK calls without a framework around them, which is the case the model SDK adapter exists for. It also
      imports the MCP SDK in source while the MCP adapter reads configuration files, and that gap is reported as a
      blind spot rather than hidden.

  - name: gpt-researcher
    source: git
    url: https://github.com/assafelovic/gpt-researcher.git
    commit: 5d84d2f5553e70a2765a8ff3a0d2672d60437ce8
    kind: agent_system
    why: >-
      An application built on a framework this build claims, which is the shape every other agent_system entry here
      is not: six of them are the frameworks themselves, and their graphs are mostly their own test suites. Every
      field report so far has been an application, which is why they found what this corpus did not. Five adapters
      contribute here at once, langgraph beside effects, prompts, mcp and model-sdk, so a reader that stops
      recognising an application while still recognising its framework's own repository shows up as a diff.

  - name: open-deep-research
    source: git
    url: https://github.com/langchain-ai/open_deep_research.git
    commit: 1b7d2e80db9faa586165c60e09096dbbfd483a64
    kind: agent_system
    why: >-
      The only pinned repository that reaches a search index, so it is what stops the retrieval component kind
      going back to having no producer outside a fixture. Small and dense rather than large: 45 files carrying a
      LangGraph application, an Azure search client and a model call with no declared deadline, which is three
      readers joined on one graph in a repository a person can read in an afternoon.

  - name: open-deep-research-exercised
    source: git
    url: https://github.com/langchain-ai/open_deep_research.git
    commit: 1b7d2e80db9faa586165c60e09096dbbfd483a64
    kind: agent_system
    why: >-
      The same commit as the entry above, measured with a run in it, and the first run of a LangGraph application
      anywhere in this corpus. Every OpenInference span this build has read came from one instrumentor, the OpenAI
      Agents SDK's, and the rule that decides whether a span reports a component or the instrumentation's own
      structure was reasoned against that dialect and measured against nothing else. LangChain and LangGraph are
      the other dialect: they label a graph, a node, a sequence and a lambda alike as CHAIN, and four entries here
      pin that family with no run among them.

      What it found is that the rule deleted the application. A run of thirty one spans walks all nine declared
      nodes of the deep researcher graph, and twenty three of those spans were declined as naming nothing: what was
      left was a model and a tool, no observed relation at all, and a join reporting zero exercised components
      against twenty six declared. That was recorded here before it was fixed, because an expectation written
      afterwards cannot show what the fix moved.

      It also holds the count of a decision. A node whose implementation is a subgraph nests that subgraph's nodes
      inside itself, and a nesting between two agents is a handoff, so this run draws five hands_off_to relations
      between nodes that this repository declares no relation between at all: hands_off_to reads thirteen where the
      scan without a run reads eight. Calling it containment instead buys nothing, since the declared contains is
      from a graph to its nodes and a relation between two nodes joins neither way, and it would trade five relations
      a reader can question for five a reader cannot see. The reading is kept, and the number is pinned so that
      changing it is a decision rather than a diff.

      What the entry holds now is the counts that go quiet if the reading stops working. Seven of the nine nodes
      join, and joinedOnNameAlone is the list of them. Ten spans are still declined and that number is the guard on
      the other half: the compiled graph, the two subgraph loops and the runnables a node builds inside itself all
      name nothing, and a reading that admitted them would report a node as having run four times. The two nodes
      that do not join are the reason the entry is worth having at all. This repository declares supervisor and
      supervisor_tools twice, once in the deep researcher graph and once in the legacy one, so the adapter
      disambiguated both and a run naming a bare supervisor cannot say which it ran. Refusing to guess is the
      behaviour being pinned. ambiguousNames had one producer before this and it is not the same case:
      pydantic-ai-exercised reports agent because ninety eight declared agents in that library's examples carry that
      name and no run could pick one. These two are inside one application, and the run names the subgraph that
      contains the node it ran, so this is a tie something could break.
    exercise:
      why: >-
        The dialect measurement, and the second application in this corpus rather than a driver written around a
        library example. LangGraph's own tracing exports to LangSmith rather than over OTLP, so the spans come from
        openinference-instrumentation-langchain, which hangs off LangChain's callback manager and therefore sees
        every node of the compiled graph whatever the application did to build it.

        The run is bounded rather than representative: clarification off, no search API, and one iteration with one
        research unit and one tool call, which is the smallest configuration that still walks the whole declared
        path from the entry node to the final report. What it costs is a credential, which is stated rather than
        discovered, and a run without it is skipped with the reason printed.
      script: corpus/runs/open-deep-research/exercise.py
      # The versions the checkout's own uv.lock resolves, because a corpus entry pinned to a commit and installed
      # against whatever the index resolved today is measuring the index. mcp is named after the adapter that wants
      # it: the adapter's own floor admits a 2.x that moved RequestContext, and the import fails before any graph is
      # built. The instrumentor is deliberately unpinned, since a dialect moving in the field is what this measures.
      pythonPackages:
        - langgraph==1.2.9
        - langchain==1.3.9
        - langchain-openai==1.1.14
        - langchain-mcp-adapters==0.2.1
        - mcp==1.28.1
        - tavily-python==0.7.5
        - aiohttp==3.14.3
        - openinference-instrumentation-langchain
        - opentelemetry-sdk
        - opentelemetry-exporter-otlp-proto-http
      requiresEnvironment:
        - OPENAI_API_KEY

  - name: memory-agent-js
    source: git
    url: https://github.com/langchain-ai/memory-agent-js.git
    commit: fde601d1674e18ce55a0d7f9d7f90064bbda333d
    kind: agent_system
    why: >-
      A LangGraph application in JavaScript, which is the half of that framework this corpus reads only from the
      library that defines it. langgraph and langgraphjs are framework repositories, open-deep-research is Python,
      and a repository that documents an API and a repository that uses one are different shapes. This is five
      source files declaring two nodes, three edges and one tool, which is small enough that a person can check
      every number here against the source in a few minutes.

  - name: memory-agent-js-exercised
    source: git
    url: https://github.com/langchain-ai/memory-agent-js.git
    commit: fde601d1674e18ce55a0d7f9d7f90064bbda333d
    kind: agent_system
    why: >-
      The same commit as the entry above, measured with a run in it, and the first LangGraph run in JavaScript
      anywhere in this corpus. Every reading this build has of the LangChain dialect was argued from Python spans:
      that a chain span naming a node in its metadata is that node, that the node's own span is the one the graph
      named after it, and that everything else composed inside it names nothing. Those are claims about what an
      instrumentor emits, and the JavaScript instrumentor is a different program.

      What it holds is whether that reading survives the crossing. Both declared nodes join, so the shape of the
      metadata document generalises, and the two declared relations join neither way, because LangGraph runs its
      nodes as siblings under one pregel span rather than nesting each in the one that routed to it.

      It also records what the two instrumentors do not agree on. The JavaScript one emits a node span for
      __start__, the sentinel LangGraph reserves for the entry of a graph, and the Python one does not: the same two
      node graph written in both produces three spans in Python and four in JavaScript. No application can declare
      that name, because addNode rejects it, and the adapter on the declared side has excluded it since it was
      written. The other disagreement is the provider: the Python instrumentor writes llm.provider and this one
      writes neither that nor llm.system, so the model here is named gpt-4o-mini where the Python entry names
      openai/gpt-4.1-mini-2025-04-14, and that is what the span said rather than something this build could fix.
    exercise:
      why: >-
        The dialect measurement in the other ecosystem. openinference-instrumentation-langchain is the instrumentor
        for the same reason its Python sibling is: LangGraph's own tracing exports to LangSmith rather than over
        OTLP, and this one hangs off LangChain's callback manager, so every node of the compiled graph becomes a
        span whatever the application did to build it.

        The run is bounded rather than representative: one message, one model, and a recursion limit of six, which
        is the smallest configuration that still walks both nodes and the tool between them. What it costs is a
        credential, which is stated rather than discovered, and a run without it is skipped with the reason printed.
      script: corpus/runs/memory-agent-js/exercise.mjs
      # The versions the checkout's own yarn.lock resolves, because an entry pinned to a commit and installed
      # against whatever the index resolved today is measuring the index. zod is pinned hardest of all: this
      # generation of langchain reads a tool schema through zod 3, and under zod 4 the tool arrives at the model
      # declaring no parameters while the run still succeeds. tsx compiles the checkout, whose modules import their
      # siblings with .js specifiers naming .ts files. The instrumentor is deliberately unpinned, since a dialect
      # moving in the field is what this measures.
      nodePackages:
        - '@langchain/core@0.3.57'
        - '@langchain/langgraph@0.3.0'
        - '@langchain/openai@0.5.11'
        - langchain@0.3.27
        - uuid@10.0.0
        - zod@3.23.8
        - '@arizeai/openinference-instrumentation-langchain'
        - tsx
        - '@opentelemetry/sdk-trace-node'
        - '@opentelemetry/exporter-trace-otlp-http'
      requiresEnvironment:
        - OPENAI_API_KEY

  - name: openai-cs-agents-demo
    source: git
    url: https://github.com/openai/openai-cs-agents-demo.git
    commit: bd7bfca0f5abf50529370814c3e7c88542011925
    kind: agent_system
    why: >-
      Two findings on this repository were checked against the source by hand and are true: baggage_tool is defined
      in tools.py and named in no agent's tool list, so configured-tool-has-no-caller and the unreachable half of
      topology-shape are both right about it. A rule loosened until it stops seeing that, or tightened until it
      reports the tools that are wired, moves this entry. Forty three files, so the whole of what it claims can be
      read against the source.

      It is also where reachability was answered by something unrelated. This application's six agents hand off to
      one another and back, so no agent has an inbound relation to spare and none of them qualified as a root, and
      the roots that were left are three Flask routes no adapter joins to the agent graph. Seventeen of the twenty
      two components that participate in control flow were reported unreachable, including every agent and every
      tool that is wired, and deleting the three routes would have reported none. What topology-shape names here is
      seven components now: the six in the cycle and baggage_tool.

  - name: openai-cs-agents-demo-exercised
    source: git
    url: https://github.com/openai/openai-cs-agents-demo.git
    commit: bd7bfca0f5abf50529370814c3e7c88542011925
    kind: agent_system
    why: >-
      The same commit as the entry above, measured with a run in it, and the only entry where the run is of an
      application rather than of a driver written around a library example. The two entries beside it drive an offline
      model, which answers from a schema and never hands off, so the handoff was the one relation the join had never
      been shown. Here the triage agent hands off to the seat agent, which calls update_seat, with two guardrails
      running around it: five components declared and exercised on code this repository did not write.

      It is also the entry that found how the join breaks, twice. A guardrail was declared as an agent and reported by
      the run as an evaluation, so reconciliation matched on kind and name, the kinds disagreed, and one guardrail
      became two components. And the SDK performs a handoff as a tool call, so a run exercised a tool named for the
      agent it transferred to while the repository declared a hands_off_to relation, and the two never met. Both were
      recorded here before either was fixed, because an expectation that hides a defect makes the entry agree with it.

      It found a third, and that one was the expensive one. The instrumentor opens a span for the trace and one per
      iteration of the agent loop, each carrying a kind and no name, and reading those as components put a wrapper
      between every agent and everything it did: the run said a turn called update_seat and ran both guardrails, so
      not one of the forty two relations this application declares had ever been reported as exercised.

      What that leaves this entry holding is the counts each fix goes quiet on. The tool count is what a handoff read
      as a tool inflates. The absence of any agent_group is what a wrapper read as a component brings back. The two
      contains relations are the guardrails running their own agents, which used to be read as transfers of control.
      And validated_by holding at twelve rather than fourteen is the run joining the guardrail relations the repository
      declares instead of drawing two of its own beside them.
    exercise:
      why: >-
        The join on an application, with a provider actually called. Both other exercised entries are hermetic by
        design and neither can take a handoff, since an offline model answers in one turn. What this costs is that the
        entry cannot run without a credential, which is stated rather than discovered: `requiresEnvironment` names it
        and a run without it is skipped with the reason printed.
      script: corpus/runs/openai-cs-agents-demo/exercise.py
      # The OpenAI Agents SDK carries its own tracing, which exports to OpenAI's platform rather than over OTLP, so
      # the spans this join needs come from the OpenInference instrumentor. Its span kinds, model names and tool names
      # were already decoded by packages/traces/src/attributes.ts. Its handoff was not: that arrives as a tool span
      # carrying both agents, and packages/traces/src/handoff.ts is what reads it.
      pythonPackages:
        - openai-agents
        - openai-chatkit
        - pydantic
        - openinference-instrumentation-openai-agents
        - opentelemetry-sdk
        - opentelemetry-exporter-otlp-proto-http
      requiresEnvironment:
        - OPENAI_API_KEY

  - name: flask
    source: git
    url: https://github.com/pallets/flask.git
    commit: 36e4a824f340fdee7ed50937ba8e7f6bc7d17f81
    kind: not_agent_system
    why: >-
      A widely read Python web framework with no agent in it. The ceiling is eleven components, all of them side
      effects, and no agent system detected.

  - name: express
    source: git
    url: https://github.com/expressjs/express.git
    commit: ae6dd37680e3a00618d6c8a3e522f0ee4eeba1a4
    kind: not_agent_system
    why: >-
      The same test in JavaScript. The ceiling is five components and no agent system detected.

  - name: axios
    source: git
    url: https://github.com/axios/axios.git
    commit: 311fcc5c8d989b7248f05d390bb83bfbfb009977
    kind: not_agent_system
    why: >-
      An HTTP client, so a repository dense in the exact facts the effect reader looks for: requests, retries and
      timeouts. It is the entry that says what the effect reader costs on code that has nothing to do with agents,
      and the ceiling that stops the retry and timeout rules from being widened into noise.

  - name: open-agent-platform
    source: git
    url: https://github.com/langchain-ai/open-agent-platform.git
    commit: 6a2ea0a3d019c20550b8d88ca0ed4d57df774ac8
    kind: not_agent_system
    why: >-
      A client of agent systems rather than one of them, which is the negative case every other entry of this kind
      misses. Flask, Express and axios are general purpose libraries with nothing to do with agents, so they say
      nothing about a reader loosened until an import decides the answer. This repository is about agents
      throughout: it imports `@langchain/langgraph-sdk` in twenty one places, holds an MCP client in
      `use-mcp.tsx`, and declares no graph anywhere. No `StateGraph`, no `createReactAgent`, no node added and
      nothing compiled, because the graphs it talks to and the servers it connects to are somewhere else. The
      ceiling is twenty six components, every one of them a database, an entry point or a service the effect
      reader found, and no agent system detected.

      The number that decides it is `adapter:langgraph`, which applies here and inspects twelve files and
      produces nothing. That is the adapter reading the client of a framework and declining to call it the
      framework, so a reader widened until an import or an SDK type is enough moves that zero and this entry
      with it.

      Both blind spots it reports are true of this build and are part of the measurement. `@modelcontextprotocol/sdk`
      is imported to build a client, and the MCP adapter reads configuration and the call sites that declare a
      server; `@langchain/core` is imported for message and document types, and the LangGraph adapter reads graphs.
      An adapter that starts claiming either one has to move this entry.

      The upstream repository is marked deprecated at this commit. The commit is pinned and stays readable, and a
      client of a framework is the shape being tested rather than this project in particular, so a replacement
      would have to be another repository that is about agents and declares none.
