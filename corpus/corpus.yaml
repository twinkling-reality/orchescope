# The corpus.
#
# Every adapter in this repository was validated against a fixture written by whoever wrote the adapter, which is
# circular: the fixture encodes what the author already believed. This file pins real repositories instead, so that
# what a scan produces is measured rather than assumed, and so that a framework moving in the field shows up as a
# diff rather than as silence.
#
# Third party source is never vendored here. Each entry names a commit. The full corpus clones that commit into
# `corpus/.cache`; selected required entries use a bounded archive whose normalized source tree and licence file are
# pinned below. Both destinations are ignored by git. Licence compliance is the reason: this repository is
# Apache-2.0 and the corpus is not, so source obtained for measurement stays outside it.
#
# An entry needs:
#   name    the file name under corpus/expected, and the directory name in the cache
#   source  git for a third party repository, local for a directory of this repository
#   kind    agent_system or not_agent_system, which is the claim the expectation has to bear out
#   why     what this entry is here to catch, in enough detail that removing it is a decision
#
# An entry may also carry an `exercise` block, which names a script that makes the repository emit spans so the
# declared against exercised delta can be measured on it. Those entries install an environment and run third party
# code, so they are skipped unless `--exercise` is passed, and the skip is printed rather than silent. An exercise
# that reaches a provider names the variables it cannot start without in `requiresEnvironment`, and a machine
# without them skips that entry with the reason printed rather than failing inside somebody else's SDK.
# A git entry may name `subpath` when one independently published package inside a monorepo is the audit target. The
# checkout and revision still belong to the repository root. `multiRepositorySystems` repeats the exact URL and
# commit of every participating entry, then states the runtime crossing evidence and its refusal condition. That
# list locates source and never counts as evidence that two processes communicated.
# A static git entry may carry `requiredArchive`. Its URL repeats the exact commit through GitHub's archive API. The
# tree digest covers every normalized path, executable bit and file byte; the separate licence digest proves the
# expected notice survived acquisition. Gzip bytes, generated root names and archive metadata are not the pin.
#
# Both polarities count. A repository that is not an agent system is a precision test: the number it holds is a
# ceiling, and the guard against a reader being loosened until it matches ordinary English.

schemaVersion: 2

repositories:
  - name: demonstration-system
    source: local
    path: apps/demo
    kind: agent_system
    why: >-
      The bundled demonstration, which is the only entry that exercises the manifest adapter and the only one that
      runs with no network at all. It is in both the offline and required subsets, so a change to the traversal, the
      effect reader or the prompt reader is caught by the gate rather than by a dispatch a maintainer has to remember
      to start.

  - name: orchescope-discovery
    source: local
    path: packages/discovery
    kind: not_agent_system
    why: >-
      Every framework name Orchescope knows appears in this directory as a string literal, and so does most of the
      vocabulary of the domain. A reader that matches on names rather than on facts lights it up. The ceiling is
      zero components: this package reads agent systems and is not one.

  - name: openai-agents-python
    source: git
    url: https://github.com/openai/openai-agents-python.git
    commit: c1b423749e2bf8ca5f89cad13e2a144c9683a6ee
    kind: agent_system
    why: >-
      The first real repository this tool was pointed at, and the one that crashed it: an adapter named an endpoint
      it never created and one unbuildable relation ended a scan of 843 files. It is also the repository that shows
      what findings do at scale, which is what milestone 2 has to fix.

  - name: openai-agents-sdk-v2-demo
    source: git
    url: https://github.com/box-community/openai-agents-sdk-v2-demo.git
    commit: daf811baacd06f6829d904f596b1125a5817be04
    kind: agent_system
    why: >-
      The exact MIT-licensed positive application selected by the independent blind evaluation of candidate
      95c7756c. Its source imports agents.Runner, constructs a SandboxAgent and calls Runner.run_streamed, while this
      build's OpenAI Agents reader contributes no component. The regression holds the honest boundary: the applicable
      adapter and effects reader complete with zero output, adapter_found_nothing remains visible, topology is
      incomplete at the exact import, and no absence claim, finding or strength is inferred from that silence.

      The pinned Git tree contains 9 blobs and 153,089 blob bytes without truncation. The source scan discovers 2
      files, parses its 1 supported Python file without a skip, and covers 10,944 source bytes. LICENSE is an MIT
      notice with SHA-256 930aade4d7252572313cc91189846780eb4f06be9085a7de8976ebb48be5aa08. This is a
      full-static corpus entry with no required archive or exercise environment.
    # This explicit zero contract is definition-backed. Recording aggregate totals cannot teach the harness to hide
    # a completed applicable adapter, topology refusal or unsupported-area explanation.
    acceptance:
      type: completed_zero
      expectedAgentSystemDetected: false
      graphPopulation:
        components: 0
        edges: 0
      evidencePopulation:
        records: 0
      evidenceCoverage:
        totalEligible: 0
        included: 0
        omitted: 0
        requiredIncluded: 0
        omissionReasons: []
      componentMetricPopulation:
        records: 0
      runtimePopulation:
        runs: 0
        observed:
          count: 0
          runIds: []
        silent:
          count: 0
          runIds: []
      adapterOutcomes:
        adapter:openai-agents:
          status: completed
          componentsFound: 0
          edgesFound: 0
          filesInspected: 1
          languages:
            - python
        adapter:effects:
          status: completed
          componentsFound: 0
          edgesFound: 0
          filesInspected: 0
          languages: []
      unsupported:
        - kind: adapter_found_nothing
          area: agents is imported here and its adapter found nothing
          reason: >-
            adapter:openai-agents claims this framework, ran and found no component. Either this build does not read
            the form this repository uses, or this repository imports the framework as a client and declares nothing
            an adapter could read.
      topology:
        status: incomplete
        unresolvedCount: 1
        conditionalDestinations: 0
        producers:
          - adapterId: adapter:openai-agents
            status: incomplete
            scope: control_flow
            inspectedInputs: 0
            relationsFound: 0
        requiredRefusals:
          - kind: adapter_input
            reason: >-
              adapter:openai-agents did not state an inspected topology population for this applicable input.
            sourceFile: main.py
            startLine: 16
            fileHash: 5a5026fe20e94206493025a8772dbfb3b03608959bbc90856c8ea5d5720a5ef7
      findings:
        total: 0
        strengths: 0

  - name: openai-agents-js
    source: git
    url: https://github.com/openai/openai-agents-js.git
    commit: 52b2702fc034fb47f79ec50fad173f0e9b068ca6
    kind: agent_system
    why: >-
      The same framework in the other ecosystem. The adapter claims to read one fact model in two languages, and
      only a repository in each language holds that claim up.

  - name: openai-agents-js-exercised
    source: git
    url: https://github.com/openai/openai-agents-js.git
    commit: 52b2702fc034fb47f79ec50fad173f0e9b068ca6
    kind: agent_system
    why: >-
      The same commit as the entry above, measured with a run in it, and the first OpenAI Agents run in
      JavaScript anywhere in this corpus. That dialect is the richest source of defects this build has had, and
      every one of them was found in Python: a handoff arriving as a tool call, the instrumentation's own
      wrapper spans becoming components, and a provider written under only one of two attribute names. Each of
      those is a claim about what one program emits, and the JavaScript instrumentor is a different program.

      What it found is that the handoff reading does not cross. The Python instrumentor writes a tool span with
      no tool name whose input and output are the two agents, spelled as bare strings. This one names the span's
      tool handoff_to_Seat Booking Agent and writes {"from_agent": "Triage Agent"} and {"to_agent": "Seat
      Booking Agent"} as JSON documents. Both halves of the existing test therefore fail: a span that names a
      tool is a call to that tool, and neither value is a name any agent was reported under. So a transfer of
      control was reported as a call to a tool nothing declared, which is exactly the defect 0.7.0 fixed in the
      other ecosystem, unfixed in this one. That was recorded here before it was fixed, because an expectation
      written afterwards cannot show what the fix moved: hands_off_to reads twenty nine where it read twenty
      eight, calls_tool seventy nine where it read eighty, and the tool component is gone from the graph
      entirely, so exercised-not-declared names one component where it named two.
      openai-cs-agents-demo-exercised does not move, and it is the control: the bare form is still read exactly
      as it was, and only where the span names no tool.

      Two things the entry pins that are properties of the repository rather than defects. Triage Agent is in
      joins.ambiguous because this repository declares 292 agents across its examples and more than one of them
      carries that name, which is the same refusal pydantic-ai-exercised holds for a different reason. And the
      one relation this run joins is worth naming: before it, four entries carrying runs joined 0, 5, 0 and 0
      declared relations between them, so the relation half of this product's central join had almost no
      evidence anywhere.
    exercise:
      why: >-
        The dialect measurement in the other ecosystem, on the repository's own customer service example. The
        agents, the tools and the handoffs between them are the example's; what the driver supplies is the
        model, through the SDK's own setDefaultModelProvider.

        That choice is what makes the entry hermetic and reproducible, and the second half is not optional.
        Driven by a real gpt-4o-mini the same conversation produced eight spans, then eleven, then eight: the
        seat agent follows a routine that asks for a confirmation number, and whether it asks again before
        calling its tool is the model's decision. An entry pins a span count, so the decisions have to be the
        driver's. What it costs is the model span: the SDK opens a generation span from its own model
        implementations and not from somebody else's, so this run reports no LLM span at all, and what that
        instrumentor writes on one is pinned in packages/traces/test instead.
      script: corpus/runs/openai-agents-js/exercise.mjs
      # The published release of the version this checkout's own packages/agents declares. The checkout is the
      # framework rather than a user of one, and building its workspace would edit a pinned repository, so the
      # closest honest pin is the release of the same version. zod is the version the checkout's own lockfile
      # resolves. The instrumentor is deliberately unpinned, since a dialect moving in the field is what this
      # measures.
      nodePackages:
        - '@openai/agents@0.13.5'
        - '@openai/agents-core@0.13.5'
        - zod@4.3.5
        - '@arizeai/openinference-instrumentation-openai-agents'
        - '@opentelemetry/sdk-trace-node'
        - '@opentelemetry/exporter-trace-otlp-http'

  - name: openai-agents-js-provider-exercised
    source: git
    url: https://github.com/openai/openai-agents-js.git
    commit: 52b2702fc034fb47f79ec50fad173f0e9b068ca6
    kind: agent_system
    why: >-
      The same commit as the two entries above, measured with a run that reaches a real provider. It is here for
      one fact neither of them can hold: what this build reports when its own `fetch` shim and the target's
      instrumentation watch the same model call.

      0.8.0 taught the reader to keep the better placed of the two and to stop naming a model call after the host
      that served it, and said plainly that no corpus entry witnessed either change. Every entry carrying a run
      drove an offline model, or ran Python where the shim does not apply, or reached a provider through
      `openai@4`, which bundles `node-fetch` and is invisible to a patch on `globalThis.fetch`. The hermetic
      sibling is the first of those by construction: it supplies its own model provider, so the SDK opens a
      generation span from somebody else's implementation, no request leaves the process, and it reports no model
      span at all. What held the two fixes instead was one stored run in `packages/traces/test`.

      This run makes both readable in the corpus. `@openai/agents` resolves `openai@6`, which has no dependencies
      and makes its requests with `globalThis.fetch`, so four spans arrive from two producers: three from
      `@arizeai/openinference-instrumentation-openai-agents` for the workflow, the agent and the response, and one
      from this build for the POST to `/v1/responses`. **They describe one call and one model is reported.** The
      two producers name a model differently, `gen_ai.request.model` being what was sent and `llm.model_name`
      being what came back. **The witness is a component count.** The graph without a run holds 9 models; this
      entry records 10, and a run read as two calls would record 11, because `gpt-5.4-mini` and
      `gpt-5.4-mini-2026-03-17` are two names. The one it keeps is the response's, which is the second fix as
      well: `orchescope.component` is no longer set on a model call, and set to the host every model a run
      called would arrive as one component named `api.openai.com`.

      The whole graph is the entry above plus what this run added, which is the arithmetic worth checking: 668
      components with no run, 669 with the hermetic one, which adds an agent nothing declared, and 670 here,
      which adds that agent and the model.

      **The dated model is the provider's and not this repository's.** `hello-world.ts` names no model, so the
      alias comes from the SDK version pinned below and the snapshot behind it comes from OpenAI. When they move
      it this entry differs on one identifier, which is a true report of the provider having changed rather than
      a defect, and open-deep-research-exercised has carried a dated snapshot the same way since it was pinned.

      The agent does not join, and the reason is a property of the repository rather than a defect. This checkout
      declares 292 agents across its examples and four of them are named `Assistant`, so the name the run reports
      has four declarations and the reconciler refuses, which is the same refusal the hermetic sibling holds for
      `Triage Agent`. The model does not join either, which is the gap the README states: a model is chosen where
      a run is configured rather than where an agent is written, and this example names none at all.
    exercise:
      why: >-
        The repository's own `examples/basic/hello-world.ts`, which is one agent holding no tool and no handoff,
        answering one turn. That shape is the whole reason a provider run can be pinned here at all: the hermetic
        sibling drives the customer service example, where the same conversation against a real gpt-4o-mini
        produced eight spans, then eleven, then eight, because whether the seat agent asks for a confirmation
        number again is the model's decision. An agent with nothing to call has no decision to make, so one turn
        is one model call whatever the answer says, and the driver supplies nothing but the instrumentation.

        What it costs is a credential, which is stated rather than discovered, and a run without it is skipped
        with the reason printed.
      script: corpus/runs/openai-agents-js-provider/exercise.mjs
      # The same pins as the hermetic sibling, for the same reasons, so that the only difference between the two
      # runs is the one this entry exists to measure.
      nodePackages:
        - '@openai/agents@0.13.5'
        - '@openai/agents-core@0.13.5'
        - zod@4.3.5
        - '@arizeai/openinference-instrumentation-openai-agents'
        - '@opentelemetry/sdk-trace-node'
        - '@opentelemetry/exporter-trace-otlp-http'
      requiresEnvironment:
        - OPENAI_API_KEY

  - name: mcp-filesystem-server
    source: git
    url: https://github.com/modelcontextprotocol/servers.git
    commit: 3e805376da81c063c2798410906b5fd134334a43
    subpath: src/filesystem
    kind: agent_system
    why: >-
      The independently versioned server launched by the pinned OpenAI Agents JavaScript repository's own
      `examples/mcp/filesystem-example.ts`. That example requests `@modelcontextprotocol/server-filesystem`
      2026.1.14, its lock resolves exactly 2026.1.14, and this is the peeled commit of that release tag. The audit
      root is the filesystem package rather than the whole MCP Servers monorepo, which bounds the topology to the
      implemented stdio server and its filesystem tools without pretending the other server packages are part of
      this application.

  - name: langgraph
    source: git
    url: https://github.com/langchain-ai/langgraph.git
    commit: 30c4d58db86455128e42ddec96b1ba53c553ba22
    kind: agent_system
    why: >-
      The library whose functional API produced "no agent system was detected" when the truth was that the reader
      was behind. Its own tests and examples are written in every form the library documents, which is exactly the
      surface a per framework reader drifts away from.

      Sixteen of its handoffs are read out of Command(goto=) returns, which is the idiom this library defines and
      which an application declares its whole graph in. All sixteen are in its own test files, so every component
      they touch is marked declaredInTest and no rule fires on any of them. The number is here because it is the
      reading measured against the library that defines the idiom, and because it moving is how a rename in
      langgraph.types would be noticed.

  - name: langgraphjs
    source: git
    url: https://github.com/langchain-ai/langgraphjs.git
    commit: 07ba620415532c3d9935ff8946bda3685412444a
    kind: agent_system
    why: >-
      LangGraph in JavaScript, and the entry that currently reports two blind spots: the repository imports the
      Vercel AI SDK and an OpenAI client that the adapters claiming them read nothing from. Those two lines are the
      measurement, and they stay in the expectation until an adapter earns their removal.

      It is also where the Command(goto=) reading finds nothing, and both reasons are worth stating rather than
      leaving as a zero. This repository imports its own Command from a relative path rather than from the package,
      and the reading asks where Command came from, because a class named after a common noun is the one most
      likely to collide. Its graphs also pass an inline function to addNode, and the fact model reduces a function
      argument to the fact that it is one, so nothing connects the commands inside it to the node it implements.
      An application does neither: it imports from the package and registers a named function. That the number here
      is zero while open-deep-research reads ten is the difference between a library and a use of one.

  - name: crewai
    source: git
    url: https://github.com/crewAIInc/crewAI.git
    commit: b3aaaab023a53a08db4d36c9430b3463f1efcc7d
    kind: agent_system
    why: >-
      The CrewAI framework itself, and the largest tree in this corpus: 2027 files discovered against 1272 parsed,
      which is the parse rate a Python repository of that shape actually produces. 304 of its 854 components are
      declared in its own tests, so what it holds is the parse rate and the marking, and the two entries below are
      what hold the reading.

      It is also the only entry that measures a role no run can report. Three agents.yaml live here, two of them the
      templates `crewai create crew` writes and one its own test suite, and four of their seven agents declare a role
      of the form `{topic} Senior Data Researcher`. CrewAI interpolates that before it uses it, so the literal string
      is a name no run will ever say. Each of those four is named by the key its document files it under and declares
      no runtime name, and this repository is where that decline is measured: `adapter:crewai` carries a detail
      saying it declined four, which reaches --json and MCP because the terminal prints an adapter's detail only
      for one that failed. The seven keys are the whole of the +7 agents here; none of them declares an llm, so no
      model and no relation follows.
      declaredInTest does not move, because a component read out of a document has no source location and the flag is
      derived from source locations alone.

  - name: crewai-examples
    source: git
    url: https://github.com/crewAIInc/crewAI-examples.git
    commit: da94a91e691e1cf5b3151416bb15b5b62729bea8
    kind: agent_system
    why: >-
      CrewAI read from applications that use it rather than from the framework that defines it, which is the entry
      that says what a reader with a crew actually sees. Sixteen crews and seven flows, every one of them a declared
      application with no test suite inflating it, and both ways the framework's own documentation writes a crew: a
      literal Agent(role=...) in the older examples, and the @CrewBase class with config/agents.yaml that
      `crewai create crew` generates in the newer ones.

      It is here because the second of those is what the field uses and it is the one this build read worst. Forty
      four Agent calls across nineteen files were nineteen components, one per file and each of them named `agent`,
      because Agent(config=...) names no role and definitionForCall looks for a variable or a function where the
      framework's own template writes a method. Reading the enclosing method makes them forty three, one pair still
      sharing a method name across two classes in one file, so the count here is 73 agents from source where it was
      49.

      The twenty agents.yaml those calls select an entry of are now read where they live. Every one of them sits at
      a path ending config/agents.yaml and none at the repository root, so a fixed path reached none of them; they
      are found by file name in the same bounded traversal, under a cap of their own rather than the deployment
      manifest's. They hold 48 agent keys, all 48 declaring a role and none an llm, which is why this entry gains 48
      agents, no model and no relation, and why the agent count here is 121.

      **That 121 is 48 documents plus 73 calls and the repository has fewer agents than either sum suggests.** Three
      of the four agents of crews/marketing_strategy are declared twice, once by the document and once by the method
      that builds them, and nothing in the repository says which call reads which entry: the subscript in
      Agent(config=self.agents_config['lead_market_analyst']) is not a fact this build's model carries. Binding them
      by the enclosing method name holds for 31 of the 50 Agent calls that sit beside an agents.yaml here, so the
      other 19 would attach a call to the wrong declared agent. The doubling is the price of not guessing, and it is
      recorded here rather than hidden behind a heuristic.

  - name: crewai-examples-exercised
    source: git
    url: https://github.com/crewAIInc/crewAI-examples.git
    commit: da94a91e691e1cf5b3151416bb15b5b62729bea8
    kind: agent_system
    why: >-
      The same commit as the entry above, measured with a run in it. This was the first CrewAI span in the corpus and
      the falsifier for runtime source identity. Name alone finds three declarations for every observed role: the
      marketing crew, another crew with the same roles and a copied integration. The run therefore used to refuse
      all three roles as ambiguous.

      The bounded CrewAI integration now observes the immediate Python caller when each real Agent is constructed
      and attaches that identity only when the same Agent later executes. It supplies an absolute file, line,
      function, canonical repository URL and full clean-checkout revision. Reconciliation validates every field
      against the independently scanned checkout. The result is three `code_location` joins, zero `runtime_name`
      joins, zero runtime-only agents and zero ambiguous names. The static count stays 81 agents. Declared facts do
      not select a runtime identity, and changing only a name or declaration cannot move this measurement.

      The crew joins nothing either, for a different reason. Its span is a CHAIN carrying no gen_ai.workflow.name, so
      isStructuralSpan declines it as no_name, and the name it declines is `MarketingPostsCrew.kickoff` where the
      declared group is named after the method that builds it. Nothing nests inside a declined span, which is why
      exercisedEdges is zero against sixteen declared.

      No model span is produced at all: the instrumentor writes none unless it is started with an event listener,
      and a CrewAI application pairs it with an instrumentor for whichever client it calls.
    exercise:
      why: >-
        The repository's own marketing crew, driven by a model that answers from the driver's own process. Three
        agents run five tasks in sequence under one crew, no provider is reached and no credential is used. What it
        cannot reach is a tool: both tools this crew declares search the internet, so the scripted model asks for
        none, and this entry therefore says nothing about what a CrewAI tool span looks like.
      script: corpus/runs/crewai-examples/exercise.py
      # CrewAI declares requires-python <3.14. On a newer interpreter pip resolves `crewai` down to 0.11.2 and then
      # fails building a tiktoken with no wheel for it, so an environment built from the wrong one measures a release
      # from before any of this existed rather than failing.
      pythonInterpreter: python3.12
      # In install order. crewai-tools is the checkout's own dependency: the crew constructs SerperDevTool and
      # ScrapeWebsiteTool while it is being built, and neither constructor needs a credential.
      pythonPackages:
        - crewai==1.15.17
        - crewai-tools==1.15.17
        - openinference-instrumentation-crewai==1.1.12
        - opentelemetry-sdk==1.42.1
        - opentelemetry-exporter-otlp-proto-http==1.42.1

  - name: pydantic-ai
    source: git
    url: https://github.com/pydantic/pydantic-ai.git
    commit: ed0f40c0e5061722f7d9f579ed7efff1b74e3ea5
    kind: agent_system
    why: >-
      The newest adapter, so the one with the least field evidence behind it. It is also the only entry that does
      not read every file it claims to: four Python files are past the size limit, and that number is worth watching
      on its own.

  - name: pydantic-ai-exercised
    source: git
    url: https://github.com/pydantic/pydantic-ai.git
    commit: ed0f40c0e5061722f7d9f579ed7efff1b74e3ea5
    kind: agent_system
    why: >-
      The same commit as the entry above, measured with a run in it. It is a second entry rather than a flag on the
      first because a stored run adds components and relations to the graph, and one expectation cannot describe a
      repository both with and without its own run. This is the only entry that exercises the declared against
      exercised join on code this repository did not write.
    exercise:
      why: >-
        The declared against exercised delta is the centre of this product and it had only ever been shown on the
        demonstration this repository also wrote. This is the join on third party code: the library's own
        bank_support example, driven by the library's own offline model, so a real run reaches a real declaration
        and every name that fails to match is recorded rather than assumed.
      script: corpus/runs/pydantic-ai/exercise.py
      # In install order. The checkout pins its sibling packages by an exact version, so pydantic_graph has to be
      # installed from the checkout before pydantic_ai_slim asks for it. The provider client is needed because the
      # example names an OpenAI model and the constructor resolves the provider while the module is imported; no
      # request is ever made, and the driver turns model requests off to guarantee it.
      pythonPackages:
        - pydantic_graph
        - pydantic_ai_slim
        - openai
        - opentelemetry-sdk
        - opentelemetry-exporter-otlp-proto-http
      # The checkout is shallow and has no tags, so the version this build backend derives from git is empty. This
      # tells it to use a fixed version instead of failing, which is what makes an install from a pinned commit work.
      buildEnvironment:
        UV_DYNAMIC_VERSIONING_BYPASS: 0.0.0

  - name: vercel-ai-chatbot
    source: git
    url: https://github.com/vercel/ai-chatbot.git
    commit: c2f8235e1f3ea903ad8b7f61447c4f74164b5c58
    requiredArchive:
      url: https://api.github.com/repos/vercel/ai-chatbot/tarball/c2f8235e1f3ea903ad8b7f61447c4f74164b5c58
      treeSha256: b890c5a849e7807d364ec1ff8252791377742bfbe917d04eeb28ccf3ce5dc80d
      licensePath: LICENSE
      licenseSha256: 5809eb2eab284b24fc53b21484398fd264c6f929d3b32ecdc7108a89f037e943
    kind: agent_system
    why: >-
      The Vercel AI SDK read from an application that uses it rather than from the library that defines it. A
