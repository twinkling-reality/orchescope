      It parses existing coding-agent session logs, attributes tokens and cost, identifies producer fingerprints and
      renders reports; it does not select actions or invoke tools as an agent. Its optional pricing-update command
      places fetch inside the async run method of an object passed to a command definition.

      The frozen candidate attributed that request to module scope. This regression holds the generalized precision
      boundary: a named object callable owns the effects in its body, including when its object is nested in a call
      argument. The graph caller, dynamic-service scope, relation, citation, finding subject and Mermaid label must
      agree on the source-authoritative `run` method. The opaque command wrapper does not prove that it returns the
      object under the variable's name, while the repository remains correctly negative.

      The pinned repository has 99 tracked files. Its MIT LICENSE has SHA-256
      7f938135f347074ddbbfdc9f11949055fb6b6ee44f95fefa10c95fa8dadc7a60. This is static-only and runs no target code.
