  - name: axios
    source: git
    url: https://github.com/axios/axios.git
    commit: 311fcc5c8d989b7248f05d390bb83bfbfb009977
    kind: not_agent_system
    why: >-
      An HTTP client, so a repository dense in the exact facts the effect reader looks for: requests, retries and
      timeouts. It is the entry that says what the effect reader costs on code that has nothing to do with agents,
      and the ceiling that stops the retry and timeout rules from being widened into noise.

  - name: open-agent-platform
    source: git
    url: https://github.com/langchain-ai/open-agent-platform.git
    commit: 6a2ea0a3d019c20550b8d88ca0ed4d57df774ac8
    requiredArchive:
      url: https://api.github.com/repos/langchain-ai/open-agent-platform/tarball/6a2ea0a3d019c20550b8d88ca0ed4d57df774ac8
      treeSha256: c4d4fa6fd3e06036ca0d1418dcd8ba0bdc580bf088c8e39b2cc1ec5347f95caf
      licensePath: LICENSE
      licenseSha256: 61e5e8faf0b76db76793ecd8aa0edca36a82bd8dba279d2a31972f026c132423
    kind: not_agent_system
    why: >-
      A client of agent systems rather than one of them, which is the negative case every other entry of this kind
      misses. Flask, Express and axios are general purpose libraries with nothing to do with agents, so they say
      nothing about a reader loosened until an import decides the answer. This repository is about agents
      throughout: it imports `@langchain/langgraph-sdk` in twenty one places, holds an MCP client in
      `use-mcp.tsx`, and declares no graph anywhere. No `StateGraph`, no `createReactAgent`, no node added and
      nothing compiled, because the graphs it talks to and the servers it connects to are somewhere else. The
      ceiling is twenty six components, every one of them a database, an entry point or a service the effect
      reader found, and no agent system detected.

      The number that decides it is `adapter:langgraph`, which applies here and inspects twelve files and
      produces nothing. That is the adapter reading the client of a framework and declining to call it the
      framework, so a reader widened until an import or an SDK type is enough moves that zero and this entry
      with it.

      Both blind spots it reports are true of this build and are part of the measurement. `@modelcontextprotocol/sdk`
      is imported to build a client, and the MCP adapter reads configuration and the call sites that declare a
      server; `@langchain/core` is imported for message and document types, and the LangGraph adapter reads graphs.
      An adapter that starts claiming either one has to move this entry.

      The upstream repository is marked deprecated at this commit. The commit is pinned and stays readable, and a
      client of a framework is the shape being tested rather than this project in particular, so a replacement
      would have to be another repository that is about agents and declares none.

multiRepositorySystems:
  - name: openai-agents-js-filesystem-mcp
    repositories:
      - name: openai-agents-js
        url: https://github.com/openai/openai-agents-js.git
        commit: 52b2702fc034fb47f79ec50fad173f0e9b068ca6
      - name: mcp-filesystem-server
        url: https://github.com/modelcontextprotocol/servers.git
        commit: 3e805376da81c063c2798410906b5fd134334a43
    why: >-
      This is one upstream-authored agent system across two independently versioned MIT repositories. The OpenAI
      Agents example constructs an agent with `MCPServerStdio`, resolves the separately published filesystem server
      entry point and launches it as a child process. The server registers the tools the agent lists and calls over
      that stdio session. The package constraint and lock in the client repository select release 2026.1.14, whose
      release tag peels to the server commit pinned here.
    crossingEvidence: >-
      Acceptance requires a successful MCP `tools/call` over the real stdio boundary with client and server spans in
      one W3C trace. The client request span and server handler span must preserve their parent relationship, and
      each side must carry its own canonical repository URL, full revision and source coordinate. The successful
      filesystem result is evidence that the request crossed; the repository identities say which implementations
      handled it.
    falsifier: >-
      Refuse the pairing when trace context does not cross the stdio request, either repository URL or revision is
      missing, conflicting or stale, either endpoint lacks a source coordinate in its own checkout, or the emitted
      server build cannot be mapped uniquely to the pinned source. The two-entry corpus list locates checkouts and
      is never observed evidence that the request crossed between them.
    exercise:
      why: >-
        The client repository's own filesystem example launches the server repository's actual compiled package over
        stdio. A deterministic model selects the real read_text_file tool from the server's advertised list and reads
        one line from the example's own sample file. The integration captures client and server source call sites,
        carries W3C context in MCP request metadata and exports both processes to the same bounded trace receiver.

        The driver supplies execution wiring, instrumentation and a model response. It does not supply repository
        identity: each span derives its URL, revision and file from the clean Git checkout owning its runtime frame.
      runtimeRepository: openai-agents-js
      script: corpus/runs/openai-agents-js-filesystem-mcp/exercise.mjs
      nodePackages:
        - '@openai/agents@0.13.5'
        - '@openai/agents-core@0.13.5'
        - openai@6.46.0
        - '@modelcontextprotocol/sdk@1.26.0'
        - '@modelcontextprotocol/server-filesystem@2026.1.14'
        - zod@4.4.3
        - diff@5.2.2
        - glob@10.5.0
        - minimatch@10.2.4
        - zod-to-json-schema@3.25.1
        - '@opentelemetry/api@1.9.0'
        - '@opentelemetry/sdk-trace-node@2.2.0'
        - '@opentelemetry/exporter-trace-otlp-http@0.207.0'
        - '@opentelemetry/resources@2.2.0'
        - typescript@5.8.2
        - '@types/node@22.10.2'
        - '@types/diff@5.0.9'
