    kind: agent_system
    why: >-
      The exact MIT-licensed application used by the independent 0.9.0 blind evaluation, promoted only after its
      defect families were generalized. Its five LangGraph nodes, named conditional router, entry and terminal
      boundaries, configurable Ollama and LM Studio paths, and four search alternatives put topology completeness,
      provider identity, applicability and claim evidence in one real repository that no adapter author selected.

      The static regression must retain the deterministic router cycle without an acyclic strength, keep
      httpx.Client out of the Postgres population, preserve the configuration-backed model and search possibilities
      with their source evidence, and preserve structured producer applicability. The runtime-selected exact model is
      deliberately absent from the source and belongs to the separate acceptance rerun rather than this static
      expectation.

      A fresh shallow checkout occupies 1,016 KiB including 380 KiB of Git data. The commit archive is 188,306
      compressed bytes and 634,880 expanded archive bytes. Its normalized 606,447 source bytes span 18 files, the
      largest file is 542,192 bytes, and the pinned LICENSE text grants the MIT permission. All four acquisition
      ceilings remain unchanged.

      No exercise block is declared. The local-model and live-search run takes about seven minutes, depends on a
      separately running model and changing network results, and remains an external original-target release
      measurement rather than a required or optional corpus execution.
