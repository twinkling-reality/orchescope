  - name: open-deep-research
    source: git
    url: https://github.com/langchain-ai/open_deep_research.git
    commit: 1b7d2e80db9faa586165c60e09096dbbfd483a64
    kind: agent_system
    why: >-
      The only pinned repository that reaches a search index, so it is what stops the retrieval component kind
      going back to having no producer outside a fixture. Small and dense rather than large: 45 files carrying a
      LangGraph application, an Azure search client and a model call with no declared deadline, which is three
      readers joined on one graph in a repository a person can read in an afternoon.

      It is also the repository that showed a graph declared from inside its own nodes. This adapter read add_edge
      and add_conditional_edges, which is how the library's first documentation wires a graph and is neither of the
      two ways this application does it: a node returns Command(goto="write_research_brief"), and seven of the
      eight relations deep_researcher.py declares between its own nodes are written that way. Nine nodes with one
      relation between two of them was the whole declared graph, and topology-shape reported a strength saying the
      topology is reachable, acyclic and narrow. It is a supervisor loop. A strength claimed because the relations
      were invisible is worse than either a missing finding or a wrong one, which is why the count is here now:
      transitions_to reads eighteen where it read eight, and the strength is four cycles across eight components,
      which are supervisor and supervisor_tools, researcher and researcher_tools, and two more in the legacy
      graphs. Every one of the ten new relations is a Command(goto=) line in this repository that a reader can
      open.

  - name: open-deep-research-exercised
    source: git
    url: https://github.com/langchain-ai/open_deep_research.git
    commit: 1b7d2e80db9faa586165c60e09096dbbfd483a64
    kind: agent_system
    why: >-
      The same commit as the entry above, measured with a run in it, and the first run of a LangGraph application
      anywhere in this corpus. Every OpenInference span this build has read came from one instrumentor, the OpenAI
      Agents SDK's, and the rule that decides whether a span reports a component or the instrumentation's own
      structure was reasoned against that dialect and measured against nothing else. LangChain and LangGraph are
      the other dialect: they label a graph, a node, a sequence and a lambda alike as CHAIN, and four entries here
      pin that family with no run among them.

      What it found is that the rule deleted the application. A run of thirty one spans walks all nine declared
      nodes of the deep researcher graph, and twenty three of those spans were declined as naming nothing: what was
      left was a model and a tool, no observed relation at all, and a join reporting zero exercised components
      against twenty six declared. That was recorded here before it was fixed, because an expectation written
      afterwards cannot show what the fix moved.

      It also holds the count of a corrected decision. A node whose implementation is a subgraph nests that
      subgraph's steps inside itself. The run therefore observes five containment relations between workflow steps;
      it does not establish that either step is an agent or that one handed work to the other. The static adapter
      can prove seven workflow constructions in this checkout, but cannot partition their registered nodes across
      multiple graph receivers in the same modules. The nine observed workflow steps therefore remain runtime-only
      instead of being guessed into one of those workflows.

      What the entry holds is the bounded result of that refusal: thirty one spans produce nine workflow steps, one
      runtime model, one runtime tool and five containment relations; zero steps or relations join the declared
      graph. Ten nested structural spans still name no component, which guards the other half of the reading: the
      compiled graph, subgraph loops and runnables built inside a node must not be promoted into duplicate steps.
      A future source reader that can prove graph-scoped node identity may improve this delta, but this expectation
      cannot claim that proof before the adapter has it.
    exercise:
      why: >-
        The dialect measurement, and the second application in this corpus rather than a driver written around a
        library example. LangGraph's own tracing exports to LangSmith rather than over OTLP, so the spans come from
        openinference-instrumentation-langchain, which hangs off LangChain's callback manager and therefore sees
        every node of the compiled graph whatever the application did to build it.

        The run is bounded rather than representative: clarification off, no search API, and one iteration with one
        research unit and one tool call, which is the smallest configuration that still walks the whole declared
        path from the entry node to the final report. What it costs is a credential, which is stated rather than
        discovered, and a run without it is skipped with the reason printed.
      script: corpus/runs/open-deep-research/exercise.py
      # The versions the checkout's own uv.lock resolves, because a corpus entry pinned to a commit and installed
      # against whatever the index resolved today is measuring the index. mcp is named after the adapter that wants
      # it: the adapter's own floor admits a 2.x that moved RequestContext, and the import fails before any graph is
      # built. The instrumentor is deliberately unpinned, since a dialect moving in the field is what this measures.
      pythonPackages:
        - langgraph==1.2.9
        - langchain==1.3.9
        - langchain-openai==1.1.14
        - langchain-mcp-adapters==0.2.1
        - mcp==1.28.1
        - tavily-python==0.7.5
        - aiohttp==3.14.3
        - openinference-instrumentation-langchain
        - opentelemetry-sdk
        - opentelemetry-exporter-otlp-proto-http
      requiresEnvironment:
        - OPENAI_API_KEY

