  - name: memory-agent-js
    source: git
    url: https://github.com/langchain-ai/memory-agent-js.git
    commit: fde601d1674e18ce55a0d7f9d7f90064bbda333d
    kind: agent_system
    why: >-
      A LangGraph application in JavaScript, which is the half of that framework this corpus reads only from the
      library that defines it. langgraph and langgraphjs are framework repositories, open-deep-research is Python,
      and a repository that documents an API and a repository that uses one are different shapes. This is six
      source files declaring two nodes and two relations between them, small enough that a person can check every
      number here against the source in a few minutes: the third edge the file writes runs from the START sentinel
      and is an entry point rather than a relation, and the fourth branch of the conditional runs to END.

      What it declares and this build does not read is the tool. upsertMemory is built with tool() from
      @langchain/core/tools inside a function that closes over the run's configuration, and no adapter reads that
      shape, so the entry beside this one reports a tool nothing declared. That is true of this build rather than
      of the repository, and it is part of what these two entries hold.

  - name: memory-agent-js-exercised
    source: git
    url: https://github.com/langchain-ai/memory-agent-js.git
    commit: fde601d1674e18ce55a0d7f9d7f90064bbda333d
    kind: agent_system
    why: >-
      The same commit as the entry above, measured with a run in it, and the first LangGraph run in JavaScript
      anywhere in this corpus. Every reading this build has of the LangChain dialect was argued from Python spans:
      that a chain span naming a node in its metadata is that node, that the node's own span is the one the graph
      named after it, and that everything else composed inside it names nothing. Those are claims about what an
      instrumentor emits, and the JavaScript instrumentor is a different program.

      What it holds is whether that reading survives the crossing. Both declared nodes join, so the shape of the
      metadata document generalises, and the two declared relations join neither way, because LangGraph runs its
      nodes as siblings under one pregel span rather than nesting each in the one that routed to it.

      What it found is where the two instrumentors do not agree. The JavaScript one opens a node span for
      __start__, the name LangGraph keeps for the entry of a graph, and the Python one opens none: the same two node
      graph written in both produces three spans there and four here. It arrives named after itself and carrying
      itself in langgraph_node, which is a node span's exact shape, so it was read as one and reported as an agent
      that ran without being declared. No repository can declare it, because addNode rejects the name in both
      ecosystems, and the adapter on the declared side has excluded it since it was written. That was recorded here
      before it was fixed, because an expectation written afterwards cannot show what the fix moved: three agents
      and seven components became two and six, and exercised-not-declared went from naming three components to two
      while still reporting two findings, which is why componentsByRule is beside byRule. open-deep-research-exercised
      does not move, and it is the control.

      The other disagreement is the provider, and this one is not a defect of this build. The Python instrumentor
      writes llm.provider and this one writes neither that nor llm.system, so the model here is named gpt-4o-mini
      where the Python entry names openai/gpt-4.1-mini-2025-04-14. That is what the span said, and inventing the
      provider from the model name would be a guess.
    exercise:
      why: >-
        The dialect measurement in the other ecosystem. openinference-instrumentation-langchain is the instrumentor
        for the same reason its Python sibling is: LangGraph's own tracing exports to LangSmith rather than over
        OTLP, and this one hangs off LangChain's callback manager, so every node of the compiled graph becomes a
        span whatever the application did to build it.

        The run is bounded rather than representative: one message, one model, and a recursion limit of six, which
        is the smallest configuration that still walks both nodes and the tool between them. What it costs is a
        credential, which is stated rather than discovered, and a run without it is skipped with the reason printed.
      script: corpus/runs/memory-agent-js/exercise.mjs
      # The versions the checkout's own yarn.lock resolves, because an entry pinned to a commit and installed
      # against whatever the index resolved today is measuring the index. zod is pinned hardest of all: this
      # generation of langchain reads a tool schema through zod 3, and under zod 4 the tool arrives at the model
      # declaring no parameters while the run still succeeds. tsx compiles the checkout, whose modules import their
      # siblings with .js specifiers naming .ts files. The instrumentor is deliberately unpinned, since a dialect
      # moving in the field is what this measures.
      nodePackages:
        - '@langchain/core@0.3.57'
        - '@langchain/langgraph@0.3.0'
        - '@langchain/openai@0.5.11'
        - langchain@0.3.27
        - uuid@10.0.0
        - zod@3.23.8
        - '@arizeai/openinference-instrumentation-langchain'
        - tsx
        - '@opentelemetry/sdk-trace-node'
        - '@opentelemetry/exporter-trace-otlp-http'
      requiresEnvironment:
        - OPENAI_API_KEY

  - name: openai-cs-agents-demo
    source: git
    url: https://github.com/openai/openai-cs-agents-demo.git
    commit: bd7bfca0f5abf50529370814c3e7c88542011925
    requiredArchive:
      url: https://api.github.com/repos/openai/openai-cs-agents-demo/tarball/bd7bfca0f5abf50529370814c3e7c88542011925
      treeSha256: 2142a5a7c05192da3ce70e88c6b8aae560d4533a448d53f6fe441670f20bc4b7
      licensePath: LICENSE
      licenseSha256: fdd680f28af4ae4e155cc35b3d37da81d57ffa94359fceb53fcb4c11d5ce2c0d
    kind: agent_system
    why: >-
      Two findings on this repository were checked against the source by hand and are true: baggage_tool is defined
      in tools.py and named in no agent's tool list, so configured-tool-has-no-caller and the unreachable half of
      topology-shape are both right about it. A rule loosened until it stops seeing that, or tightened until it
      reports the tools that are wired, moves this entry. Forty three files, so the whole of what it claims can be
      read against the source.

      It is also where reachability was answered by something unrelated. This application's six agents hand off to
      one another and back, so no agent has an inbound relation to spare and none of them qualified as a root, and
      the roots that were left are three Flask routes no adapter joins to the agent graph. Seventeen of the twenty
      two components that participate in control flow were reported unreachable, including every agent and every
      tool that is wired, and deleting the three routes would have reported none. What topology-shape names here is
      seven components now: the six in the cycle and baggage_tool.

  - name: openai-cs-agents-demo-exercised
    source: git
    url: https://github.com/openai/openai-cs-agents-demo.git
    commit: bd7bfca0f5abf50529370814c3e7c88542011925
    kind: agent_system
    why: >-
      The same commit as the entry above, measured with a run in it, and the only entry where the run is of an
      application rather than of a driver written around a library example. The two entries beside it drive an offline
      model, which answers from a schema and never hands off, so the handoff was the one relation the join had never
      been shown. Here the triage agent hands off to the seat agent, which calls update_seat, with two guardrails
      running around it: five components declared and exercised on code this repository did not write.

      It is also the entry that found how the join breaks, twice. A guardrail was declared as an agent and reported by
      the run as an evaluation, so reconciliation matched on kind and name, the kinds disagreed, and one guardrail
      became two components. And the SDK performs a handoff as a tool call, so a run exercised a tool named for the
      agent it transferred to while the repository declared a hands_off_to relation, and the two never met. Both were
      recorded here before either was fixed, because an expectation that hides a defect makes the entry agree with it.

      It found a third, and that one was the expensive one. The instrumentor opens a span for the trace and one per
      iteration of the agent loop, each carrying a kind and no name, and reading those as components put a wrapper
      between every agent and everything it did: the run said a turn called update_seat and ran both guardrails, so
      not one of the forty two relations this application declares had ever been reported as exercised.

      What that leaves this entry holding is the counts each fix goes quiet on. The tool count is what a handoff read
      as a tool inflates. The absence of any agent_group is what a wrapper read as a component brings back. The two
      contains relations are the guardrails running their own agents, which used to be read as transfers of control.
      And validated_by holding at twelve rather than fourteen is the run joining the guardrail relations the repository
      declares instead of drawing two of its own beside them.
    exercise:
      why: >-
        The join on an application, with a provider actually called. Both other exercised entries are hermetic by
        design and neither can take a handoff, since an offline model answers in one turn. What this costs is that the
        entry cannot run without a credential, which is stated rather than discovered: `requiresEnvironment` names it
        and a run without it is skipped with the reason printed.
      script: corpus/runs/openai-cs-agents-demo/exercise.py
      # The OpenAI Agents SDK carries its own tracing, which exports to OpenAI's platform rather than over OTLP, so
      # the spans this join needs come from the OpenInference instrumentor. Its span kinds, model names and tool names
      # were already decoded by packages/traces/src/attributes.ts. Its handoff was not: that arrives as a tool span
      # carrying both agents, and packages/traces/src/handoff.ts is what reads it.
      pythonPackages:
        - openai-agents
        - openai-chatkit
        - pydantic
        - openinference-instrumentation-openai-agents
        - opentelemetry-sdk
        - opentelemetry-exporter-otlp-proto-http
      requiresEnvironment:
        - OPENAI_API_KEY

