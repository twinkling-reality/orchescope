  - name: jarvis-home-commander
    source: git
    url: https://github.com/Roozbeh-Sdtz/jarvis-home-commander.git
    commit: 740d23097b6525feb1ef8de740a18e16598db8de
    kind: agent_system
    why: >-
      The exact MIT-licensed positive application selected independently for the blind evaluation of candidate
      48828a1d. Its voice agent is operated through the Codex desktop application and household device scripts, an
      external runtime boundary the static adapters decline explicitly. The regression invariant comes from the
      device source the frozen candidate misread: a Telegram consumer commits its update offset before sending a
      receipt, OAuth device authorization polls only while the server reports pending, and HomeWizard pairing repeats
      only after an explicit non-success response. None proves that the same non-idempotent operation is reissued
      after an ambiguous failure.

      The corrected scan therefore reports no retry relation or duplicate-effect finding for those loops. It also
      reports no repository scenario and cannot claim deterministic chaos verification or prescribe a scenario path.
      A separate generalized fixture preserves the true positive: a caught ambiguous failure that reissues a known
      non-idempotent operation still carries retry policy and fires the reliability rule.

      The pinned repository has 42 tree entries and 185,911 blob bytes. Its MIT LICENSE has SHA-256
      b9b7a0bd8894a4c5124e1509a6f849c44e38ddda1b182e3bab6dbdc201dfed29. No runtime is attempted: a representative
      run needs the real Codex voice session, Accessibility permission, paired HomeKit state, household devices, LAN
      addresses and credentials, and the repository supplies no bounded substitute path.
    acceptance:
      expectedAgentSystemDetected: false
      graphPopulation:
        components: 21
        edges: 11
      exactIdsByKind:
